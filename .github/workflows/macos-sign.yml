name: Repair macOS preview signatures
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: v0.1.0
      release_id:
        required: true
env:
  PYTHONUTF8: '1'
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
          - target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - run: python scripts/verify-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.tag }}
      - run: cargo fetch --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - run: python scripts/licenses.py
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles app,dmg
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Verify complete signed application
        run: codesign --verify --deep --strict "src-tauri/target/${{ matrix.target }}/release/bundle/macos/序图.app"
      - run: python scripts/package-release.py --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - run: python scripts/upload_assets.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
  aggregate:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
      - name: Fetch all verified target assets from the same draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          release=json.loads(subprocess.check_output(['gh','api',f"repos/{repo}/releases/{os.environ['RELEASE_ID']}"],text=True))
          assert release['draft'] and release['tag_name']==os.environ['TAG']
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert release['target_commitish']==head
          version=json.loads(Path('package.json').read_text())['version']
          platforms=['macos-arm64','macos-x64','windows-x64','linux-x64']
          names={f'manifest-{p}.json' for p in platforms}|{f'LICENSES-{p}.txt' for p in platforms}
          for p,ext in [('macos-arm64','dmg'),('macos-x64','dmg'),('windows-x64','exe'),('linux-x64','AppImage'),('linux-x64','deb')]:
              names.add(f'xutu-studio_{version}_{p}.{ext}')
          assets={a['name']:a for a in release['assets']}
          assert names<=assets.keys()
          out=Path('release-artifacts');out.mkdir()
          for name in sorted(names):
              asset=assets[name];path=out/name
              with path.open('wb') as file:
                  subprocess.run(['gh','api','--allow-escape-sequences','-H','Accept: application/octet-stream',f"repos/{repo}/releases/assets/{asset['id']}"],stdout=file,check=True)
              with path.open('rb') as file:
                  assert 'sha256:'+hashlib.file_digest(file,'sha256').hexdigest()==asset['digest']
          PY
      - run: python3 scripts/aggregate-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TAG: ${{ inputs.tag }}
